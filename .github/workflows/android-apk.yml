name: Gerar APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar o Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar o Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: 5. Compilar Projeto Web
        run: npm run build

      - name: 6. Criar Configuracao do Capacitor (JSON)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          echo '{"appId": "com.omniflow.app", "appName": "OmniFlow", "webDir": "dist"}' > capacitor.config.json
          npx cap add android || true
          npx cap sync android

      - name: 7. Garantir Permissao no Gradle
        run: chmod +x android/gradlew

      - name: 8. Compilar APK Android
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 9. Enviar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: omniflow-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
