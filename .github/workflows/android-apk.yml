name: Gerar APK Android Nativo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar o Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Instalar as Dependências
        run: npm install

      - name: 5. Dar Permissão ao Gradle
        run: chmod +x android/gradlew

      - name: 6. Compilar o APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 7. Enviar o APK para o GitHub
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
