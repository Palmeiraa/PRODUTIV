    <script>
      (function() {
        var savedTheme = localStorage.getItem('omniflow_theme_mode');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
